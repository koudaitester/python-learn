<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>现场采集</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #192b2a; background: #f2f6f3; }
    * { box-sizing: border-box; }
    body { max-width: 900px; margin: 0 auto; padding: 28px 18px; }
    h1 { margin: 0 0 4px; font-size: 26px; }
    p { margin: 0 0 18px; color: #64726c; }
    main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, .7fr); gap: 18px; }
    section { padding: 18px; border: 1px solid #dce5df; border-radius: 8px; background: #fff; }
    h2 { margin: 0 0 14px; font-size: 17px; }
    video, img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #182421; border-radius: 5px; }
    img { margin-top: 10px; }
    .actions, .row { display: flex; gap: 8px; margin-top: 10px; }
    .row > label { flex: 1; }
    label { display: block; margin-top: 12px; font-size: 13px; font-weight: 650; }
    input, button { width: 100%; min-height: 40px; margin-top: 5px; padding: 8px 10px; border: 1px solid #cbd7d0; border-radius: 5px; font: inherit; }
    button { cursor: pointer; border-color: #176b58; color: #fff; background: #176b58; }
    button.secondary { color: #176b58; background: #fff; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    #status { min-height: 24px; margin-top: 12px; color: #176b58; white-space: pre-wrap; }
    #result { overflow-wrap: anywhere; white-space: pre-wrap; }
    @media (max-width: 680px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>现场采集</h1>
  <p>采集图片与温湿度，并提交到分析服务。</p>
  <main>
    <section>
      <h2>图像</h2>
      <video id="video" autoplay playsinline hidden></video>
      <img id="preview" alt="图片预览" hidden>
      <div class="actions">
        <button id="camera" type="button">开启相机</button>
        <button id="capture" class="secondary" type="button" disabled>拍照</button>
      </div>
      <label>选择或拍摄图片<input id="file" type="file" accept="image/*" capture="environment"></label>
    </section>
    <section>
      <h2>环境数据</h2>
      <div class="row">
        <label>温度（°C）<input id="temperature" type="number" step="any" placeholder="例如 24.5"></label>
        <label>湿度（%）<input id="humidity" type="number" step="any" placeholder="例如 58"></label>
      </div>
      <div class="actions">
        <button id="serial" class="secondary" type="button">连接串口</button>
        <button id="mqtt" class="secondary" type="button">连接 MQTT</button>
      </div>
      <label>MQTT WebSocket 地址<input id="broker" type="url" placeholder="wss://broker.example.com:8084/mqtt"></label>
      <label>MQTT 主题<input id="topic" placeholder="sensor/environment"></label>
      <label>分析接口<input id="endpoint" type="url" value="http://localhost:6100/analyze"></label>
      <button id="submit" type="button" style="margin-top:16px">提交图片与数据</button>
      <div id="status" role="status"></div>
    </section>
  </main>
  <section style="margin-top:18px"><h2>分析结果</h2><div id="result">等待提交</div></section>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const video = $('video'), preview = $('preview');
    let stream, image, port, reader, mqttClient, serialBuffer = '';
    const status = text => $('status').textContent = text;
    const setReading = (temperature, humidity) => {
      if (temperature != null) $('temperature').value = temperature;
      if (humidity != null) $('humidity').value = humidity;
    };
    function readSensor(text) {
      try {
        const data = JSON.parse(text);
        setReading(data.temperature ?? data.temp ?? data.t, data.humidity ?? data.hum ?? data.h);
      } catch {
        const values = text.trim().split(/[,;\s]+/).map(Number);
        if (values.length >= 2 && values.every(Number.isFinite)) setReading(values[0], values[1]);
      }
    }
    function showImage(file) {
      image = file;
      preview.src = URL.createObjectURL(file);
      preview.hidden = false;
      video.hidden = true;
    }
    $('file').onchange = event => { if (event.target.files[0]) showImage(event.target.files[0]); };
    $('camera').onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = stream;
        preview.hidden = true;
        video.hidden = false;
        $('capture').disabled = false;
        status('相机已连接');
      } catch (error) { status(`无法开启相机：${error.message}`); }
    };
    $('capture').onclick = () => {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      canvas.toBlob(blob => showImage(new File([blob], 'capture.jpg', { type: 'image/jpeg' })), 'image/jpeg', .9);
    };
    $('serial').onclick = async () => {
      try {
        if (reader) {
          await reader.cancel();
          reader.releaseLock();
          reader = null;
          await port.close();
          $('serial').textContent = '连接串口';
          return status('串口已断开');
        }
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        reader = port.readable.getReader();
        $('serial').textContent = '断开串口';
        status('串口已连接，等待传感器数据');
        const decoder = new TextDecoder();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          serialBuffer += decoder.decode(value, { stream: true });
          const lines = serialBuffer.split(/\r?\n/);
          serialBuffer = lines.pop();
          lines.forEach(readSensor);
        }
      } catch (error) { status(`串口连接失败：${error.message}`); }
    };
    $('mqtt').onclick = () => {
      if (typeof mqtt === 'undefined') return status('MQTT 客户端加载失败，请检查网络');
      if (mqttClient) { mqttClient.end(); mqttClient = null; $('mqtt').textContent = '连接 MQTT'; return status('MQTT 已断开'); }
      try {
        mqttClient = mqtt.connect($('broker').value);
        mqttClient.on('connect', () => {
          mqttClient.subscribe($('topic').value);
          $('mqtt').textContent = '断开 MQTT';
          status('MQTT 已连接，等待传感器数据');
        });
        mqttClient.on('message', (_topic, message) => readSensor(message.toString()));
        mqttClient.on('error', error => status(`MQTT 连接失败：${error.message}`));
      } catch (error) { status(`MQTT 配置无效：${error.message}`); }
    };
    $('submit').onclick = async () => {
      if (!image) return status('请先拍照或选择图片');
      const payload = new FormData();
      payload.append('image', image);
      payload.append('temperature', $('temperature').value);
      payload.append('humidity', $('humidity').value);
      try {
        status('正在提交…');
        const response = await fetch($('endpoint').value, { method: 'POST', body: payload });
        const text = await response.text();
        if (!response.ok) throw new Error(`${response.status} ${text}`);
        try { $('result').textContent = JSON.stringify(JSON.parse(text), null, 2); }
        catch { $('result').textContent = text; }
        status('提交完成');
      } catch (error) { status(`提交失败：${error.message}`); }
    };
  </script>
</body>
</html>
