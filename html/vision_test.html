<!DOCTYPE html>
<html>
<body>
<video id="cam" autoplay playsinline style="width:400px;"></video>
<canvas id="snapCanvas" style="display:none;"></canvas>
<div>
  <h3>环境评估结果</h3>
  <pre id="result"></pre>
</div>

<script>
const video = document.getElementById('cam');
const canvas = document.getElementById('snapCanvas');
const ctx = canvas.getContext('2d');
const resultDom = document.getElementById('result');
const INTERVAL_MS = 5000; // 5秒一轮
let isRunning = false;

navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
.then(stream=>{
  video.srcObject = stream;
  startLoop();
})
.catch(err=>{
  console.error("摄像头打开失败",err);
  resultDom.innerText = "摄像头错误：" + err;
})

async function startLoop(){
  if(isRunning) return;
  isRunning = true;
  try{
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video,0,0);
    const imgBase64 = canvas.toDataURL('image/jpeg',0.8);
    const res = await fetch(imgBase64);
    const blob = await res.blob();

    const formData = new FormData();
    formData.append("image", blob, "capture.jpg");
    formData.append("temperature", "22");
    formData.append("humidity", "38");

    const resp = await fetch("http://127.0.0.1:6100/analyze",{
      method:"POST",
      body: formData
      // 不要写 headers:{"Content-Type":"multipart/form-data"}
    })
    const data = await resp.json();
    resultDom.innerText = JSON.stringify(data,null,2);
  } catch(e) {
    resultDom.innerText = "请求异常：" + e.toString();
  } finally {
    isRunning = false;
    setTimeout(startLoop, INTERVAL_MS);
  }
}
</script>
</body>
</html>
